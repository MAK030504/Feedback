# Fly.io — free-tier friendly Node API (WebSockets supported)
# Docs: https://fly.io/docs/languages-and-frameworks/node/
#
# First-time setup (from backend/):
#   fly auth login
#   fly launch --no-deploy
#   fly secrets set DATABASE_URL="..." DIRECT_URL="..." JWT_SECRET="..." ...
#   fly deploy

app = "mlsa-feedback-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "5000"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
