# Render Blueprint — MLSA Feedback API
# https://render.com/docs/blueprint-spec
#
# After deploy: set CORS_ORIGIN to your frontend URL (e.g. https://your-app.vercel.app)

services:
  - type: web
    name: mlsa-feedback-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run db:deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: IP_HASH_SALT
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
